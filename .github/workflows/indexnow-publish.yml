name: IndexNow changed pages

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '**/*.html'
      - sitemap.xml
      - vercel.json

permissions:
  contents: read

concurrency:
  group: indexnow-production
  queue: max

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate integration
        run: node --test scripts/indexnow.test.js

      - name: Wait for Vercel production content and notify changed pages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/indexnow.js notify --base "$BEFORE_SHA" --head "$HEAD_SHA" --wait
